<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ponto</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <meta name="theme-color" content="#24485c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/ponto.css">
</head>
<body class="app-func">
  <header class="cabeca" id="cabeca">
    <div class="cabeca-barra">
      <button class="logo-empresa" id="logo-empresa" aria-label="Empresa"></button>
      <div class="marca-app"><span class="marca-app-icone" id="marca-icone"></span><span>PONTO</span></div>
      <button class="icone-btn" id="btn-sino" aria-label="Notificações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="ponto-vermelho oculto" id="sino-contador"></span>
      </button>
    </div>
    <div class="cabeca-titulo oculto" id="cabeca-titulo"><h1 id="titulo"></h1><p id="subtitulo"></p></div>
  </header>

  <div class="perfil oculto" id="perfil">
    <div class="avatar" id="avatar"></div>
    <div class="perfil-textos"><div class="perfil-nome" id="nome">…</div><div class="perfil-cargo" id="cargo"></div></div>
  </div>

  <main class="conteudo-app" id="tela"></main>

  <!-- Tela de bater ponto: fica montada para não desligar câmera e GPS a cada troca de tela -->
  <section class="conteudo-app oculto" id="tela-bater">
    <div class="cartao relogio"><div class="hora" id="hora">--:--</div><div class="muted" id="data"></div></div>
    <div class="camera" id="camera"><span class="muted small">Câmera desligada</span>
      <div class="guia oculto" id="guia"><span></span><div class="barra"><i></i></div></div></div>
    <div class="status" id="status"></div>
    <p id="msg" class="alerta oculto"></p>
    <button class="primary botao-grande" id="registrar" disabled>Registrar ponto</button>
    <div class="cartao">
      <h3>Marcações de hoje</h3>
      <div class="marcas" id="marcas"><span class="muted">Nenhuma ainda</span></div>
      <p class="muted small" style="margin:8px 0 0">Toque numa marcação para ver o comprovante.</p>
    </div>
  </section>

  <nav class="barra-inferior" id="barra">
    <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#arquivos" data-nav="arquivos"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Arquivos</a>
    <a href="#bater" class="botao-camera" data-nav="bater" aria-label="Bater ponto"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></a>
    <a href="#suporte" data-nav="suporte"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1z"/></svg>Suporte</a>
    <a href="#menu" data-nav="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</a>
  </nav>

  <dialog id="modal"></dialog>
  <canvas id="canvas" class="oculto"></canvas>
  <script type="module" src="/ponto.js"></script>
</body>
</html>
