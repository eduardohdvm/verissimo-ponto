# Blueprint do Render: no painel, New > Blueprint e selecione este repositório.
#
# O banco fica no Neon (neon.tech, PostgreSQL grátis), não no Render: o Render
# permite só um PostgreSQL grátis por conta. Na criação, o Render pede o
# DATABASE_URL: cole a connection string do Neon com "Connection pooling" DESLIGADO
# (o host não pode ter "-pooler") e sem o parâmetro channel_binding.
#   ex.: postgresql://usuario:senha@ep-xxxx.us-east-1.aws.neon.tech/neondb?sslmode=require
#
# Plano gratuito (teste): o servidor dorme após 15 min sem uso e as fotos das
# marcações somem a cada novo deploy.
# Para clientes reais: plan "standard" no serviço (2 GB, necessário para o facial),
# um banco pago só do ponto e um disco permanente para as fotos (bloco "disk" abaixo).
services:
  - type: web
    name: verissimo-ponto
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # O reconhecimento facial usa ~500 MB e o plano grátis tem 512 MB no total.
      # Para ligar: plan "standard" (2 GB) e FACIAL_ATIVO = "true".
      - key: FACIAL_ATIVO
        value: "false"
    # disk:
    #   name: fotos
    #   mountPath: /var/data
    #   sizeGB: 1
    # (e adicione a variável UPLOADS_DIR=/var/data/uploads)
